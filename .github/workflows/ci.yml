name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: download conformance tests
        run: ./download-tests.sh

      - name: test
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.tmp.out ./...
          grep -v "/tests/cmd/" coverage.tmp.out > coverage.out

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
