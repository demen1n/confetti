version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - bodyclose
    - misspell
    - unconvert
    - unparam

  exclusions:
    paths:
      - tests/conformance

formatters:
  enable:
    - gofmt
    - goimports
